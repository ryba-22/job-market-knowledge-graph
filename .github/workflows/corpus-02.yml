name: CORPUS-02 real200

on:
  push:
    branches: [corpus-02-expand-200]
  workflow_dispatch:

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler
          POSTGRES_DB: jobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawler -d jobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://crawler:crawler@localhost:5432/jobs
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Migrate
        run: python -m ingestion.migrate
      - name: Crawl 100 + 100
        run: >-
          python -m ingestion.batch
          --run-id corpus-02-real200
          --trigger-kind corpus-expansion
          --source both
          --limit-per-source 100
          --delay 0.12
          --manifest-out reports/corpus-02-live-manifest.json
          --report reports/corpus-02-crawl.json
      - name: Export durable compact corpus
        run: python -m ingestion.export_market_corpus --out reports/corpus-02
      - name: Verify corpus size
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("reports/corpus-02/manifest.json").read_text())
          assert m["postings"] >= 190, m
          assert m["by_source"].get("theprotocol",0) >= 95, m
          assert m["by_source"].get("justjoinit",0) >= 95, m
          print(json.dumps(m,indent=2))
          PY
      - name: Upload corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-02-real200
          path: |
            reports/corpus-02-live-manifest.json
            reports/corpus-02-crawl.json
            reports/corpus-02/manifest.json
            reports/corpus-02/corpus.jsonl.gz
