name: CORPUS-02 frozen corpus

on:
  push:
    branches: [corpus-02-expand-200]
  pull_request:
    paths:
      - "data/corpora/corpus-02/**"
      - "tests/test_corpus_02_snapshot.py"
      - ".github/workflows/corpus-02.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen corpus
        run: python -m unittest tests.test_corpus_02_snapshot -v
