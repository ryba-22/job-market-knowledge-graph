name: SOURCE-EXPANSION-01 frozen corpus

on:
  push:
    branches: [source-expansion-01-nfj-rocket]
  pull_request:
    paths:
      - "data/corpora/source-expansion-01/**"
      - "data/corpora/corpus-03/**"
      - "tests/test_corpus_03_snapshot.py"
      - ".github/workflows/source-expansion-01.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen 400-offer corpus
        run: python -m unittest tests.test_corpus_03_snapshot -v
