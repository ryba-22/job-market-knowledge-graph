name: SOURCE-EXPANSION-01 frozen market500

on:
  push:
    branches: [source-expansion-01-four-boards]
  pull_request:
    paths:
      - "data/corpora/source-expansion-01/**"
      - "tests/test_source_expansion_01_snapshot.py"
      - ".github/workflows/source-expansion-01.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen six-source corpus
        run: python -m unittest tests.test_source_expansion_01_snapshot -v
